[package]
name = "event_register_frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = "0.5"
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Location",
    "Event",
    "EventTarget",
    "SubmitEvent",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
] }
